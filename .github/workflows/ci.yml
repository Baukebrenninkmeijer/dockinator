name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build app and DMG
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent Dockinator.app Dockinator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dockinator
          path: |
            build/Dockinator.dmg
            build/Dockinator.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Dockinator.dmg build/Dockinator.zip --generate-notes
