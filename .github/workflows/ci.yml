name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build app and DMG
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent Dockinator.app Dockinator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dockinator
          path: |
            build/Dockinator.dmg
            build/Dockinator.zip
